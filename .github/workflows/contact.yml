# Outbound contact-rate tracker — runs daily in the cloud, no laptop needed.
# Put this file in the dashboards-data repo at:  .github/workflows/contact.yml
name: Contact Rates

on:
  schedule:
    - cron: '23 6 * * *'       # ~06:23 UTC daily (GitHub cron is loose)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: contact-rates
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the scripts
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build contact rates and publish
        env:
          CXM_CLIENT_ID: ${{ secrets.CXM_CLIENT_ID }}
          CXM_SECRET:    ${{ secrets.CXM_SECRET }}
          CXM_TOKEN:     ${{ secrets.CXM_TOKEN }}
          CXM_ENDPOINT:  ${{ secrets.CXM_ENDPOINT }}
          GITHUB_TOKEN:  ${{ secrets.DATA_PUSH_TOKEN }}
        run: |
          python build_contact.py --days 14
          python publish_contact.py
